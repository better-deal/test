name: Deploy EmDash CMS

on:
  push:
    branches:
      - main
    paths:
      - "emdash/**"
      - ".github/workflows/deploy-emdash.yml"
  workflow_dispatch:

concurrency:
  group: emdash-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy EmDash CMS
    defaults:
      run:
        working-directory: emdash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EmDash
        run: npm run build

      - name: Inspect migration target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx emdash migrate --status --json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash | tee /tmp/emdash-migration-status.json

      - name: Apply EmDash D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FINGERPRINT=$(node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/emdash-migration-status.json", "utf8"));
            if (!report.target?.fingerprint) {
              throw new Error("Migration target fingerprint was not returned.");
            }
            process.stdout.write(report.target.fingerprint);
          ')
          echo "Applying migrations to target fingerprint: $FINGERPRINT"
          npx emdash migrate \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash \
            --expected-target-fingerprint "$FINGERPRINT"

      - name: Deploy EmDash Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Diagnose EmDash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler tail north-emdash --format json --status error --sampling-rate 0.99 > /tmp/wrangler-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5
          echo "DIRECT D1 DEBUG:"
          curl -sS -D /tmp/debug.headers -o /tmp/debug.json -w "%{http_code}\n" https://north-emdash.komure-dad.workers.dev/__debug-db
          cat /tmp/debug.json || true
          echo
          echo "ADMIN HTTP:"
          curl -sS -D /tmp/admin.headers -o /tmp/emdash-admin.html -w "%{http_code}\n" https://north-emdash.komure-dad.workers.dev/_emdash/admin
          echo "SETUP STATUS HTTP:"
          curl -sS -D /tmp/status.headers -o /tmp/setup-status.json -w "%{http_code}\n" https://north-emdash.komure-dad.workers.dev/_emdash/api/setup/status
          echo "ROOT HTTP:"
          curl -sS -D /tmp/root.headers -o /tmp/root.html -w "%{http_code}\n" https://north-emdash.komure-dad.workers.dev/
          sleep 8
          kill $TAIL_PID 2>/dev/null || true
          echo "---- Worker error tail ----"
          cat /tmp/wrangler-tail.log || true
          echo "---- Admin response head ----"
          head -c 1500 /tmp/emdash-admin.html || true
          echo
          echo "---- Setup status body ----"
          cat /tmp/setup-status.json || true
          echo
          echo "---- Admin headers ----"
          cat /tmp/admin.headers || true
