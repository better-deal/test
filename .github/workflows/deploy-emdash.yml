name: Deploy EmDash CMS

on:
  push:
    branches:
      - main
    paths:
      - "emdash/**"
      - ".github/workflows/deploy-emdash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy EmDash CMS
    defaults:
      run:
        working-directory: emdash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Allow required dependency build scripts
        run: pnpm config set --location project onlyBuiltDependencies '["esbuild","workerd"]'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy EmDash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
