name: Deploy EmDash CMS

on:
  push:
    branches:
      - main
    paths:
      - "emdash/**"
      - ".github/workflows/deploy-emdash.yml"
  workflow_dispatch:

concurrency:
  group: emdash-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy EmDash CMS
    defaults:
      run:
        working-directory: emdash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EmDash
        run: npm run build

      - name: Inspect migration target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx emdash migrate --status --json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash | tee /tmp/emdash-migration-status.json

      - name: Apply EmDash D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FINGERPRINT=$(node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/emdash-migration-status.json", "utf8"));
            if (!report.target?.fingerprint) {
              throw new Error("Migration target fingerprint was not returned.");
            }
            process.stdout.write(report.target.fingerprint);
          ')
          echo "Applying migrations to target fingerprint: $FINGERPRINT"
          npx emdash migrate \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash \
            --expected-target-fingerprint "$FINGERPRINT"

      - name: Deploy EmDash Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy


      - name: Verify EmDash admin endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 15s npx wrangler tail north-emdash --format json --status error > /tmp/worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 3
          echo "---- Admin HTTP response ----"
          curl -sS -D /tmp/headers.txt -o /tmp/admin.html -w "HTTP_STATUS=%{http_code}\n" https://north-emdash.komure-dad.workers.dev/_emdash/admin
          cat /tmp/headers.txt
          echo "---- Admin response body ----"
          head -c 2000 /tmp/admin.html
          echo
          echo "---- Setup HTTP response ----"
          curl -sS -D /tmp/setup-headers.txt -o /tmp/setup.html -w "SETUP_HTTP_STATUS=%{http_code}\n" https://north-emdash.komure-dad.workers.dev/_emdash/admin/setup
          cat /tmp/setup-headers.txt
          echo "---- Setup response body ----"
          head -c 4000 /tmp/setup.html
          echo
          sleep 3
          kill $TAIL_PID 2>/dev/null || true
          echo "---- Worker runtime errors ----"
          cat /tmp/worker-tail.log || true
