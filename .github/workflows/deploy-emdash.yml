name: Deploy EmDash CMS

on:
  push:
    branches:
      - main
    paths:
      - "emdash/**"
      - ".github/workflows/deploy-emdash.yml"
  workflow_dispatch:

concurrency:
  group: emdash-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy EmDash CMS
    defaults:
      run:
        working-directory: emdash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EmDash
        run: npm run build

      - name: Inspect migration target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx emdash migrate --status --json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash | tee /tmp/emdash-migration-status.json

      - name: Apply EmDash D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FINGERPRINT=$(node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/emdash-migration-status.json", "utf8"));
            if (!report.target?.fingerprint) {
              throw new Error("Migration target fingerprint was not returned.");
            }
            process.stdout.write(report.target.fingerprint);
          ')
          echo "Applying migrations to target fingerprint: $FINGERPRINT"
          npx emdash migrate \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --d1 north-emdash \
            --expected-target-fingerprint "$FINGERPRINT"

      - name: Ensure menu image URL field
        env:
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
        run: |
          if npx emdash schema get products --url https://north-emdash.komure-dad.workers.dev >/tmp/products-schema.json 2>/dev/null; then
            if grep -q 'image_url' /tmp/products-schema.json; then
              echo "image_url field already exists."
              exit 0
            fi
          fi
          npx emdash schema add-field products image_url --type url --label "画像URL" --url https://north-emdash.komure-dad.workers.dev --token "$EMDASH_TOKEN"

      - name: Deploy EmDash Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
